<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Coach</title>
<style>
:root {
  --bg:#f7f4f0; --card:#fff; --ink:#1b1b1f; --mute:#7a7470; --line:#ece6df; --field:#f4efe9;
  --accent:#ec5b24; --accent-2:#ff9a4d; --soft:#fff0e7; --on-accent:#fff;
  --up:#16a34a; --up-soft:#e8f7ee; --down:#dc2626; --down-soft:#fdecec; --gold:#f59e0b;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#121214; --card:#1c1c20; --ink:#f2efec; --mute:#9d978f; --line:#2a2a30; --field:#26262b;
  --accent:#ff6a33; --accent-2:#ff9a4d; --soft:#3a2117; --up:#4ade80; --up-soft:#16301f; --down:#f87171; --down-soft:#3a1b1b; --gold:#fbbf24;
  --shadow: none; color-scheme: dark; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif; padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom)); }
main { max-width:560px; margin:0 auto; padding:12px 16px 24px; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:inherit; }
.ic { flex:none; vertical-align:-3px; }
.grow { flex:1; min-width:0; }
.row { display:flex; align-items:center; gap:10px; }
.center { text-align:center; }
.mute { color:var(--mute); }
.sm { font-size:13px; }
h1 { font-size:26px; line-height:1.15; margin:0; letter-spacing:-.02em; }
h2 { font-size:18px; margin:0; letter-spacing:-.01em; }
h3 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px; color:var(--mute); font-weight:600; }

/* top bar */
.top { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.top > div { max-width:560px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; }
.logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; letter-spacing:-.02em; flex:1; }
.logo i { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg, var(--accent-2), var(--accent)); }
.iconbtn { width:38px; height:38px; border-radius:12px; border:0; background:var(--card); box-shadow:var(--shadow); display:grid; place-items:center; color:var(--mute); }

/* hero */
.hero { background:linear-gradient(140deg, var(--accent-2) 0%, var(--accent) 60%, #d9481a 100%); color:#fff; border-radius:24px; padding:18px 18px 16px; margin:4px 0 16px; box-shadow:0 10px 30px -12px rgba(236,91,36,.6); position:relative; overflow:hidden; }
.hero::after { content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.12); }
.hero > * { position:relative; z-index:1; }
.eyebrow { font-size:13px; font-weight:600; opacity:.85; text-transform:uppercase; letter-spacing:.06em; }
.hero h1 { margin-top:2px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
.stats div { background:rgba(255,255,255,.18); border-radius:14px; padding:8px 10px; }
.stats b { display:block; font-size:24px; line-height:1.1; font-variant-numeric:tabular-nums; }
.stats span { font-size:12px; opacity:.9; }
.hero-pr { margin-top:12px; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.95); color:var(--accent); font-weight:700; font-size:14px; padding:6px 12px; border-radius:999px; }
.hero-n { font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums; margin-top:6px; }
.hero-n small { font-size:20px; font-weight:700; opacity:.85; }
.hero-n.accent { color:var(--accent); }
.hero-sub { opacity:.9; font-size:14px; }
.datebtn { position:relative; width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.2); display:grid; place-items:center; }
.datebtn input { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
.nav-w { width:40px; height:40px; border-radius:14px; background:rgba(255,255,255,.2); display:grid; place-items:center; color:#fff; text-decoration:none; }
.nav-w.off { opacity:.35; pointer-events:none; }

/* cards */
.card { background:var(--card); border-radius:20px; padding:16px; margin:0 0 12px; box-shadow:var(--shadow); border:1px solid var(--line); }
.exh { display:flex; gap:12px; align-items:flex-start; }
.ico { display:grid; place-items:center; flex:none; color:var(--accent); }
.ico.big { width:44px; height:44px; border-radius:14px; background:var(--soft); }
.trophy { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:#fff6dd; color:var(--gold); }
@media (prefers-color-scheme: dark) { .trophy { background:#3a2f12; } }

.warm { display:flex; align-items:center; gap:8px; width:100%; margin:14px 0 4px; padding:10px 12px; border-radius:14px; border:1px dashed var(--line); background:none; font-size:14px; text-align:left; }
.warm .box { width:22px; height:22px; border-radius:7px; border:2px solid var(--line); display:grid; place-items:center; color:transparent; }
.warm.on { border-style:solid; border-color:color-mix(in srgb, var(--accent) 35%, transparent); background:var(--soft); }
.warm.on .box { background:var(--accent); border-color:var(--accent); color:#fff; }

.sets { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:6px; }
.sets li { display:flex; align-items:center; gap:10px; background:var(--field); border-radius:14px; padding:8px 8px 8px 10px; font-variant-numeric:tabular-nums; }
.num { width:26px; height:26px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--mute); }
.rir { display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--mute); background:var(--card); padding:3px 8px; border-radius:999px; }
.del { width:32px; height:32px; border:0; background:none; color:var(--mute); border-radius:10px; display:grid; place-items:center; }

.form { margin-top:12px; padding:14px; border-radius:18px; background:var(--field); }
.steppers { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.steppers.one { grid-template-columns:1fr; }
.stepper { background:var(--card); border-radius:14px; padding:8px; text-align:center; }
.stepper label { display:block; font-size:12px; color:var(--mute); font-weight:600; }
.stepper div { display:flex; align-items:center; gap:2px; }
.stepper button { width:32px; height:36px; flex:none; border-radius:12px; border:0; background:var(--field); display:grid; place-items:center; }
.stepper input { width:100%; min-width:0; border:0; background:none; text-align:center; font-size:clamp(20px, 6.4vw, 28px); font-weight:800; font-variant-numeric:tabular-nums; padding:0; outline:none; letter-spacing:-.02em; }
.stepper > span { font-size:12px; color:var(--mute); }
.lbl { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600; margin:14px 0 8px; }
.lbl .mute { font-weight:400; }
.chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.pill { flex:none; min-width:44px; height:38px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:600; font-size:15px; }
.pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:16px; padding:14px 18px; font-weight:700; font-size:16px; background:linear-gradient(135deg, var(--accent-2), var(--accent)); color:#fff; box-shadow:0 6px 16px -8px rgba(236,91,36,.8); }
.btn.ghost { background:var(--soft); color:var(--accent); box-shadow:none; }
.btn.wide { width:100%; margin-top:12px; }
.btn.add { margin:4px 0 0; }

.prog { display:flex; align-items:center; gap:8px; margin:14px 0 10px; padding:10px 12px; border-radius:14px; font-size:14px; }
.prog.up { background:var(--up-soft); color:var(--up); }
.prog.down { background:var(--down-soft); color:var(--down); }
.prog.flat, .prog.new { background:var(--field); color:var(--mute); }
.prog b { font-size:16px; }

.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tile { background:var(--field); border-radius:16px; padding:10px; display:flex; flex-direction:column; min-width:0; }
.tl { font-size:12px; color:var(--mute); font-weight:600; display:flex; align-items:center; gap:4px; white-space:nowrap; }
.tl .ic { color:var(--accent); }
.tv { font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tv small { font-size:12px; font-weight:600; color:var(--mute); }
.ts { font-size:12px; color:var(--mute); }
.tf { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:6px; }
.ch { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; padding:2px 7px; border-radius:999px; font-variant-numeric:tabular-nums; }
.ch.up { background:var(--up-soft); color:var(--up); }
.ch.down { background:var(--down-soft); color:var(--down); }
.ch.flat { background:var(--card); color:var(--mute); }
.badge { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; background:var(--gold); color:#fff; }
.vid { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:999px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); font-weight:600; font-size:13px; text-decoration:none; white-space:nowrap; align-self:flex-start; }
.link { display:inline-flex; align-items:center; gap:6px; margin-top:12px; color:var(--accent); font-weight:600; font-size:14px; text-decoration:none; }

.empty { text-align:center; color:var(--mute); padding:36px 16px; }
.empty .ic { color:var(--accent); opacity:.5; }

/* lists */
.ph { margin:8px 0 16px; }
.ph p { margin:4px 0 0; }
.li { display:flex; align-items:center; gap:12px; text-decoration:none; padding:12px; }
.right { text-align:right; }
.big-n { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.big-n small { font-size:12px; color:var(--mute); }
.back { display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-weight:600; text-decoration:none; margin:4px 0 10px; }
.seg { display:flex; background:var(--field); border-radius:12px; padding:3px; margin-bottom:12px; }
.seg button { flex:1; border:0; background:none; padding:8px; border-radius:10px; font-weight:600; font-size:14px; color:var(--mute); }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
svg.chart { width:100%; height:130px; display:block; }
.axis { display:flex; justify-content:space-between; font-size:12px; color:var(--mute); margin-top:4px; }
.axis b { display:block; color:var(--ink); font-size:14px; }
.axis span:last-child { text-align:right; }
.hist { padding:12px 0; border-bottom:1px solid var(--line); }
.hist:last-child { border-bottom:0; padding-bottom:0; }
.hsets { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.hsets span { background:var(--field); border-radius:10px; padding:3px 9px; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
.hsets i { font-style:normal; color:var(--mute); font-weight:500; margin-left:5px; font-size:12px; }
.quote p { margin:0; font-size:16px; }
.quote { border-left:4px solid var(--accent); }

.result { margin-top:16px; text-align:center; background:var(--soft); border-radius:18px; padding:14px; }
.result.sm-r { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ink); }
.result.sm-r .ic { color:var(--accent); }
details { margin-top:12px; }
summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:14px; padding:6px 0; }
.trow { display:flex; gap:10px; padding:8px 10px; border-radius:10px; font-variant-numeric:tabular-nums; }
.trow span:first-child { flex:1; }
.trow .mute { width:56px; text-align:right; font-size:13px; }
.trow.on { background:var(--soft); }

/* dan */
.sleep { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.sleep button { border:1px solid var(--line); background:var(--field); border-radius:14px; padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; }
.sleep b { font-size:22px; line-height:1.1; }
.sleep span { font-size:11px; color:var(--mute); font-weight:600; }
.sleep button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.sleep button.on span { color:#fff; opacity:.9; }
.food { margin-bottom:4px; }
.food li { padding:8px 4px 8px 12px; flex-wrap:wrap; }
.tag { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--card); color:var(--mute); }
.tag.slatko, .tag.grickalice { color:var(--down); background:var(--down-soft); }
.search.plain { background:var(--card); }
.chips.tags { margin-top:10px; display:grid; grid-template-columns:repeat(3,1fr); }
.chips.tags .pill { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:0 6px; font-size:14px; min-width:0; }
.hint { margin:10px 0 0; display:flex; align-items:center; gap:6px; }
.wrow { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
.wrow .stepper { background:var(--field); }
.wrow .stepper button { background:var(--card); }
.wrow .btn { height:100%; }
.tiles.two { grid-template-columns:1fr 1fr; }

/* bottom nav */
nav { position:fixed; left:0; right:0; bottom:0; z-index:6; background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav > div { max-width:560px; margin:0 auto; display:flex; }
nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 6px; color:var(--mute); font-size:11px; font-weight:600; text-decoration:none; }
nav a span.pip { width:44px; height:28px; border-radius:999px; display:grid; place-items:center; transition:background .15s; }
nav a.on { color:var(--accent); }
nav a.on span.pip { background:var(--soft); }

/* sheet + toast */
#sheet { position:fixed; inset:0; z-index:20; }
#sheet .scrim { position:absolute; inset:0; background:rgba(0,0,0,.35); opacity:0; transition:opacity .2s; }
#sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:85vh; overflow:auto; background:var(--card); border-radius:24px 24px 0 0; padding:8px 18px calc(18px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .22s ease; max-width:560px; margin:0 auto; }
#sheet.open .scrim { opacity:1; }
#sheet.open .panel { transform:none; }
.grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 14px; }
#sheet h2 { margin-bottom:12px; font-size:20px; }
.gl { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.gl .ic { color:var(--accent); margin-top:2px; }
.gl p { margin:2px 0 0; color:var(--mute); font-size:14px; }
.search { display:flex; align-items:center; gap:8px; background:var(--field); border-radius:14px; padding:0 12px; color:var(--mute); }
.search input { flex:1; border:0; background:none; padding:12px 0; outline:none; color:var(--ink); font-size:16px; }
.opts { display:grid; gap:4px; margin-top:10px; }
.opt { display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:none; padding:8px; border-radius:14px; font-size:16px; }
.opt .ico { width:36px; height:36px; border-radius:12px; background:var(--soft); }
.opt.new { color:var(--accent); }
#toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; display:flex; gap:6px; align-items:center; transition:.2s; pointer-events:none; z-index:30; }
#toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<div class="top"><div>
  <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg></i>Coach</div>
  <button class="iconbtn" id="help" aria-label="Što znači što?"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
</div></div>
<main id="view"></main>
<nav><div>
  <a href="#day" data-tab="day"><span class="pip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>Dan</a>
  <a href="#today" data-tab="today"><span class="pip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg></span>Trening</a>
  <a href="#exercises" data-tab="exercises"><span class="pip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>Napredak</a>
  <a href="#week" data-tab="week"><span class="pip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>Tjedan</a>
  <a href="#calc" data-tab="calc"><span class="pip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg></span>Preračun</a>
</div></nav>
<div id="sheet" hidden></div>
<div id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
